<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Tic Tac Toe</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color:transparent;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;
    min-height:100dvh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:15px;

    font-family:Arial,sans-serif;

    color:white;

    background:
    radial-gradient(
        circle at top,
        #263b78,
        #111629 55%,
        #070910
    );

    overflow-x:hidden;
}


/* =========================
   BACKGROUND LIGHT
========================= */

body::before,
body::after{

    content:"";

    position:fixed;

    width:220px;
    height:220px;

    border-radius:50%;

    filter:blur(90px);

    opacity:.3;

    pointer-events:none;

    z-index:0;
}

body::before{

    background:#00eaff;

    top:-80px;
    left:-80px;
}

body::after{

    background:#8b5cf6;

    bottom:-80px;
    right:-80px;
}


/* =========================
   MAIN CONTAINER
========================= */

.game{

    width:100%;
    max-width:430px;

    padding:22px;

    border-radius:25px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid rgba(255,255,255,.15);

    backdrop-filter:blur(15px);

    box-shadow:
    0 20px 50px rgba(0,0,0,.45);

    position:relative;

    z-index:10;
}


/* =========================
   MENU
========================= */

#menu{

    text-align:center;
}

.logo{

    font-size:
    clamp(34px,10vw,48px);

    font-weight:bold;

    margin-bottom:6px;

    background:
    linear-gradient(
        90deg,
        #00eaff,
        #b66cff
    );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}

.menu-subtitle{

    color:#aeb8d0;

    font-size:14px;

    margin-bottom:25px;
}


/* =========================
   MODE BUTTON
========================= */

.mode-button{

    width:100%;

    min-height:72px;

    margin-bottom:13px;

    padding:12px;

    border:none;

    border-radius:17px;

    color:white;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid rgba(255,255,255,.12);

    cursor:pointer;

    touch-action:manipulation;

    transition:.15s;
}

.mode-button:active{

    transform:scale(.96);

    background:
    rgba(255,255,255,.16);
}

.mode-icon{

    display:block;

    font-size:28px;

    margin-bottom:4px;
}

.mode-title{

    display:block;

    font-size:17px;

    font-weight:bold;
}

.mode-description{

    display:block;

    color:#aeb8d0;

    font-size:11px;

    margin-top:3px;
}


/* =========================
   GAME SCREEN
========================= */

#gameScreen{

    display:none;
}


/* =========================
   TITLE
========================= */

h1{

    text-align:center;

    font-size:
    clamp(28px,8vw,38px);

    margin-bottom:4px;

    background:
    linear-gradient(
        90deg,
        #00eaff,
        #b66cff
    );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}

.subtitle{

    text-align:center;

    color:#aeb8d0;

    font-size:13px;

    margin-bottom:17px;
}


/* =========================
   TURN
========================= */

.turn{

    width:100%;

    padding:11px;

    margin-bottom:16px;

    border-radius:12px;

    text-align:center;

    font-weight:bold;

    color:#00eaff;

    background:
    rgba(255,255,255,.07);
}


/* =========================
   SCORE
========================= */

.score{

    display:flex;

    gap:8px;

    margin-bottom:18px;
}

.score-box{

    flex:1;

    min-width:0;

    padding:10px 5px;

    border-radius:13px;

    text-align:center;

    background:
    rgba(255,255,255,.06);
}

.score-box span{

    display:block;

    color:#aeb8d0;

    font-size:10px;

    margin-bottom:4px;
}

.score-box strong{

    font-size:22px;
}


/* =========================
   BOARD
========================= */

.board{

    width:100%;

    display:grid;

    grid-template-columns:
    repeat(3,minmax(0,1fr));

    gap:9px;

    margin-bottom:17px;

    position:relative;

    z-index:20;

    pointer-events:auto;
}


/* =========================
   CELL
========================= */

.cell{

    width:100%;
    height:100px;

    aspect-ratio:1 / 1;

    padding:0;

    margin:0;

    border:0;

    border-radius:16px;

    background:
    rgba(255,255,255,.09);

    color:white;

    font-size:
    clamp(36px,12vw,52px);

    font-weight:bold;

    display:flex;

    justify-content:center;

    align-items:center;

    cursor:pointer;

    position:relative;

    z-index:30;

    pointer-events:auto;

    touch-action:manipulation;

    user-select:none;

    -webkit-user-select:none;

    transition:
    transform .12s,
    background .12s;
}

.cell:active{

    transform:scale(.91);

    background:
    rgba(255,255,255,.18);
}


/* =========================
   X
========================= */

.cell.x{

    color:#00eaff;

    text-shadow:
    0 0 8px #00eaff,
    0 0 20px #00eaff;
}


/* =========================
   O
========================= */

.cell.o{

    color:#c084fc;

    text-shadow:
    0 0 8px #c084fc,
    0 0 20px #c084fc;
}


/* =========================
   WIN
========================= */

.cell.win{

    background:
    rgba(0,234,255,.2);

    animation:
    winAnimation .55s infinite alternate;
}

@keyframes winAnimation{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.07);
    }

}


/* =========================
   BUTTON AREA
========================= */

.buttons{

    display:flex;

    gap:8px;

    position:relative;

    z-index:50;
}

.game-button{

    flex:1;

    min-height:50px;

    border:0;

    border-radius:14px;

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    position:relative;

    z-index:51;

    pointer-events:auto;

    touch-action:manipulation;

    transition:.15s;
}

.game-button:active{

    transform:scale(.95);
}

.restart{

    background:
    linear-gradient(
        90deg,
        #00c6ff,
        #7c3aed
    );
}

.menu-button{

    background:
    rgba(255,255,255,.1);

    border:
    1px solid rgba(255,255,255,.15);
}


/* =========================
   MESSAGE
========================= */

.message{

    min-height:24px;

    margin-top:13px;

    text-align:center;

    color:#ffd166;

    font-size:14px;

    font-weight:bold;
}


/* =========================
   SOUND BUTTON
========================= */

.sound-button{

    width:42px;

    height:42px;

    margin:0 auto 12px;

    display:block;

    border:0;

    border-radius:50%;

    background:
    rgba(255,255,255,.1);

    color:white;

    font-size:20px;

    cursor:pointer;

    touch-action:manipulation;
}


/* =========================
   SMALL PHONE
========================= */

@media(max-height:650px){

    .game{

        padding:15px;
    }

    .menu-subtitle{

        margin-bottom:15px;
    }

    .mode-button{

        min-height:58px;

        margin-bottom:8px;
    }

    .turn{

        margin-bottom:9px;

        padding:8px;
    }

    .score{

        margin-bottom:10px;
    }

    .board{

        margin-bottom:10px;
    }
}


/* =========================
   VERY SMALL PHONE
========================= */

@media(max-width:330px){

    .game{

        padding:15px;
    }

    .board{

        gap:6px;
    }

    .cell{

        border-radius:12px;
    }

}

</style>

</head>


<body>


<div class="game">


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <div class="logo">
        TIC TAC TOE
    </div>

    <div class="menu-subtitle">
        Pilih mode permainan
    </div>


    <button
    class="sound-button"
    id="soundButton"
    type="button">

        🔊

    </button>


    <button
    class="mode-button"
    id="pvpButton"
    type="button">

        <span class="mode-icon">
            👥
        </span>

        <span class="mode-title">
            1 VS 1
        </span>

        <span class="mode-description">
            Bermain bersama teman
        </span>

    </button>


    <button
    class="mode-button"
    id="computerButton"
    type="button">

        <span class="mode-icon">
            🤖
        </span>

        <span class="mode-title">
            VS COMPUTER
        </span>

        <span class="mode-description">
            Tantang kecerdasan komputer
        </span>

    </button>

</div>



<!-- =========================
     GAME SCREEN
========================= -->

<div id="gameScreen">


    <h1>
        TIC TAC TOE
    </h1>


    <p
    class="subtitle"
    id="modeText">

        Pilih mode

    </p>


    <div
    class="turn"
    id="turn">

        🎮 Giliran X

    </div>


    <!-- SCORE -->

    <div class="score">


        <div class="score-box">

            <span id="player1Name">
                PLAYER X
            </span>

            <strong id="scoreX">
                0
            </strong>

        </div>


        <div class="score-box">

            <span>
                SERI
            </span>

            <strong id="scoreDraw">
                0
            </strong>

        </div>


        <div class="score-box">

            <span id="player2Name">
                PLAYER O
            </span>

            <strong id="scoreO">
                0
            </strong>

        </div>


    </div>


    <!-- =========================
         BOARD
    ========================= -->

    <div class="board">


        <button
        type="button"
        class="cell"
        data-index="0">
        </button>


        <button
        type="button"
        class="cell"
        data-index="1">
        </button>


        <button
        type="button"
        class="cell"
        data-index="2">
        </button>


        <button
        type="button"
        class="cell"
        data-index="3">
        </button>


        <button
        type="button"
        class="cell"
        data-index="4">
        </button>


        <button
        type="button"
        class="cell"
        data-index="5">
        </button>


        <button
        type="button"
        class="cell"
        data-index="6">
        </button>


        <button
        type="button"
        class="cell"
        data-index="7">
        </button>


        <button
        type="button"
        class="cell"
        data-index="8">
        </button>


    </div>


    <!-- BUTTON -->

    <div class="buttons">


        <button
        type="button"
        class="game-button restart"
        id="restartButton">

            🔄 Main Lagi

        </button>


        <button
        type="button"
        class="game-button menu-button"
        id="menuButton">

            🏠 Menu

        </button>


    </div>


    <div
    class="message"
    id="message">
    </div>


</div>


</div>



<script>

/* =================================
   ELEMENT
================================= */

const menu =
document.getElementById("menu");

const gameScreen =
document.getElementById("gameScreen");

const pvpButton =
document.getElementById("pvpButton");

const computerButton =
document.getElementById("computerButton");

const soundButton =
document.getElementById("soundButton");

const restartButton =
document.getElementById("restartButton");

const menuButton =
document.getElementById("menuButton");

const modeText =
document.getElementById("modeText");

const turn =
document.getElementById("turn");

const message =
document.getElementById("message");

const cells =
document.querySelectorAll(".cell");

const scoreXText =
document.getElementById("scoreX");

const scoreOText =
document.getElementById("scoreO");

const scoreDrawText =
document.getElementById("scoreDraw");

const player1Name =
document.getElementById("player1Name");

const player2Name =
document.getElementById("player2Name");


/* =================================
   GAME DATA
================================= */

let board = [
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    ""
];

let currentPlayer = "X";

let currentMode = "pvp";

let gameActive = false;

let computerThinking = false;

let scoreX = 0;

let scoreO = 0;

let scoreDraw = 0;


/* =================================
   AUDIO
================================= */

let audioContext = null;

let soundEnabled = true;


/*
    Membuat AudioContext
*/

function initAudio(){

    if(!audioContext){

        const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

        if(AudioContext){

            audioContext =
            new AudioContext();

        }

    }


    if(
        audioContext &&
        audioContext.state === "suspended"
    ){

        audioContext.resume();

    }

}


/*
    Suara dasar
*/

function playTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.12
){

    if(!soundEnabled){

        return;

    }


    initAudio();


    if(!audioContext){

        return;

    }


    const oscillator =
    audioContext.createOscillator();

    const gain =
    audioContext.createGain();


    oscillator.type = type;

    oscillator.frequency.setValueAtTime(
        frequency,
        audioContext.currentTime
    );


    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}


/*
    Suara X
*/

function playXSound(){

    playTone(
        520,
        0.12,
        "sine",
        0.13
    );

}


/*
    Suara O
*/

function playOSound(){

    playTone(
        680,
        0.12,
        "sine",
        0.13
    );

}


/*
    Suara computer
*/

function playComputerSound(){

    playTone(
        300,
        0.10,
        "square",
        0.08
    );

    setTimeout(function(){

        playTone(
            450,
            0.10,
            "square",
            0.07
        );

    },80);

}


/*
    Suara menang
*/

function playWinSound(){

    if(!soundEnabled){

        return;

    }


    initAudio();


    if(!audioContext){

        return;

    }


    const notes = [
        523,
        659,
        784,
        1047
    ];


    notes.forEach(function(
        frequency,
        index
    ){

        setTimeout(function(){

            playTone(
                frequency,
                0.22,
                "sine",
                0.13
            );

        },index * 120);

    });

}


/*
    Suara seri
*/

function playDrawSound(){

    playTone(
        350,
        0.18,
        "triangle",
        0.10
    );

    setTimeout(function(){

        playTone(
            300,
            0.25,
            "triangle",
            0.08
        );

    },150);

}


/*
    Suara tombol
*/

function playButtonSound(){

    playTone(
        800,
        0.07,
        "sine",
        0.08
    );

}


/* =================================
   POLA MENANG
================================= */

const winPatterns = [

    [0,1,2],

    [3,4,5],

    [6,7,8],

    [0,3,6],

    [1,4,7],

    [2,5,8],

    [0,4,8],

    [2,4,6]

];


/* =================================
   PILIH MODE
================================= */

pvpButton.addEventListener(
    "click",
    function(){

        initAudio();

        playButtonSound();

        startGame("pvp");

    }
);


computerButton.addEventListener(
    "click",
    function(){

        initAudio();

        playButtonSound();

        startGame("computer");

    }
);


/* =================================
   START GAME
================================= */

function startGame(mode){

    currentMode = mode;

    menu.style.display = "none";

    gameScreen.style.display = "block";


    if(mode === "pvp"){

        modeText.textContent =
        "👥 Player X VS Player O";

        player1Name.textContent =
        "PLAYER X";

        player2Name.textContent =
        "PLAYER O";

    }

    else{

        modeText.textContent =
        "🤖 Kamu VS Computer";

        player1Name.textContent =
        "KAMU";

        player2Name.textContent =
        "COMPUTER";

    }


    restartGame();

}


/* =================================
   KLIK CELL
================================= */

cells.forEach(function(cell){

    cell.addEventListener(
        "click",
        function(){

            const index =
            Number(
                cell.dataset.index
            );


            /*
                Tidak boleh klik jika:
                - game selesai
                - computer berpikir
                - kotak sudah terisi
            */

            if(
                !gameActive ||
                computerThinking ||
                board[index] !== ""
            ){

                return;

            }


            initAudio();


            /*
                PEMAIN
            */

            makeMove(
                index,
                currentPlayer
            );


            /*
                Suara
            */

            if(
                currentPlayer === "X"
            ){

                playXSound();

            }

            else{

                playOSound();

            }


            /*
                Cek kemenangan
            */

            if(
                finishGame()
            ){

                return;

            }


            /*
                VS COMPUTER
            */

            if(
                currentMode === "computer"
            ){

                computerThinking = true;

                turn.textContent =
                "🤖 Computer berpikir...";


                setTimeout(
                    computerMove,
                    450
                );

            }


            /*
                1 VS 1
            */

            else{

                changePlayer();

            }

        }
    );

});


/* =================================
   MAKE MOVE
================================= */

function makeMove(
    index,
    player
){

    board[index] = player;

    cells[index].textContent =
    player;

    cells[index]
    .classList
    .add(
        player === "X"
        ? "x"
        : "o"
    );

}


/* =================================
   CHANGE PLAYER
================================= */

function changePlayer(){

    currentPlayer =
    currentPlayer === "X"
    ? "O"
    : "X";


    turn.textContent =
    "🎮 Giliran " +
    currentPlayer;

}


/* =================================
   COMPUTER MOVE
================================= */

function computerMove(){

    if(!gameActive){

        computerThinking = false;

        return;

    }


    let bestScore =
    -Infinity;

    let bestMove = -1;


    for(
        let i = 0;
        i < board.length;
        i++
    ){

        if(board[i] === ""){

            board[i] = "O";


            const score =
            minimax(
                board,
                0,
                false
            );


            board[i] = "";


            if(
                score > bestScore
            ){

                bestScore = score;

                bestMove = i;

            }

        }

    }


    if(bestMove !== -1){

        makeMove(
            bestMove,
            "O"
        );

        playComputerSound();

    }


    computerThinking = false;


    if(
        finishGame()
    ){

        return;

    }


    turn.textContent =
    "🎮 Giliran kamu: X";

}


/* ==============================
   MINIMAX AI
================================= */

function minimax(
    position,
    depth,
    maximizing
){

    const winner =
    getWinner(position);


    /*
        COMPUTER MENANG
    */

    if(winner === "O"){

        return 10 - depth;

    }


    /*
        PLAYER MENANG
    */

    if(winner === "X"){

        return depth - 10;

    }


    /*
        SERI
    */

    if(!position.includes("")){

        return 0;

    }


    /*
        COMPUTER
    */

    if(maximizing){

        let bestScore =
        -Infinity;


        for(
            let i = 0;
            i < position.length;
            i++
        ){

            if(position[i] === ""){

                position[i] = "O";


                const score =
                minimax(
                    position,
                    depth + 1,
                    false
                );


                position[i] = "";


                bestScore =
                Math.max(
                    bestScore,
                    score
                );

            }

        }


        return bestScore;

    }


    /*
        PLAYER
    */

    else{

        let bestScore =
        Infinity;


        for(
            let i = 0;
            i < position.length;
            i++
        ){

            if(position[i] === ""){

                position[i] = "X";


                const score =
                minimax(
                    position,
                    depth + 1,
                    true
                );


                position[i] = "";


                bestScore =
                Math.min(
                    bestScore,
                    score
                );

            }

        }


        return bestScore;

    }

}


/* =================================
   CEK PEMENANG
================================= */

function getWinner(position){

    for(
        const pattern of winPatterns
    ){

        const [a,b,c] =
        pattern;


        if(
            position[a] !== "" &&
            position[a] === position[b] &&
            position[b] === position[c]
        ){

            return position[a];

        }

    }


    return null;

}


/* =================================
   SELESAI GAME
================================= */

function finishGame(){

    const winner =
    getWinner(board);


    /*
        ADA PEMENANG
    */

    if(winner){

        gameActive = false;


        /*
            Cari garis kemenangan
        */

        for(
            const pattern of winPatterns
        ){

            const [a,b,c] =
            pattern;


            if(
                board[a] !== "" &&
                board[a] === board[b] &&
                board[b] === board[c]
            ){

                cells[a]
                .classList
                .add("win");

                cells[b]
                .classList
                .add("win");

                cells[c]
                .classList
                .add("win");

                break;

            }

        }


        /*
            X MENANG
        */

        if(winner === "X"){

            scoreX++;

            scoreXText.textContent =
            scoreX;


            if(
                currentMode === "computer"
            ){

                turn.textContent =
                "🏆 KAMU MENANG!";

                message.textContent =
                "🔥 Kamu berhasil mengalahkan Computer!";

            }

            else{

                turn.textContent =
                "🏆 PLAYER X MENANG!";

                message.textContent =
                "🎉 Player X memenangkan permainan!";

            }

        }


        /*
            O MENANG
        */

        else{

            scoreO++;

            scoreOText.textContent =
            scoreO;


            if(
                currentMode === "computer"
            ){

                turn.textContent =
                "🤖 COMPUTER MENANG!";

                message.textContent =
                "😈 Computer berhasil menang!";

            }

            else{

                turn.textContent =
                "🏆 PLAYER O MENANG!";

                message.textContent =
                "🎉 Player O memenangkan permainan!";

            }

        }


        playWinSound();

        return true;

    }


    /*
        SERI
    */

    if(
        !board.includes("")
    ){

        gameActive = false;

        scoreDraw++;

        scoreDrawText.textContent =
        scoreDraw;


        turn.textContent =
        "🤝 PERMAINAN SERI";

        message.textContent =
        "Tidak ada yang menang.";


        playDrawSound();

        return true;

    }


    return false;

}


/* =================================
   RESTART GAME
================================= */

restartButton.addEventListener(
    "click",
    function(){

        initAudio();

        playButtonSound();

        restartGame();

    }
);


function restartGame(){

    /*
        Jangan gunakan:
        let board

        karena board sudah dibuat
        di bagian atas.
    */

    board = [
        "",
        "",
        "",
        "",
        "",
        "",
        "",
        "",
        ""
    ];


    currentPlayer = "X";

    gameActive = true;

    computerThinking = false;


    turn.textContent =
    currentMode === "computer"
    ? "🎮 Giliran kamu: X"
    : "🎮 Giliran X";


    message.textContent = "";


    cells.forEach(
        function(cell){

            cell.textContent = "";

            cell.classList.remove(
                "x",
                "o",
                "win"
            );

        }
    );

}


/* =================================
   KEMBALI KE MENU
================================= */

menuButton.addEventListener(
    "click",
    function(){

        initAudio();

        playButtonSound();

        backToMenu();

    }
);


function backToMenu(){

    gameActive = false;

    computerThinking = false;


    gameScreen.style.display =
    "none";


    menu.style.display =
    "block";

}


/* =================================
   SOUND ON / OFF
================================= */

soundButton.addEventListener(
    "click",
    function(){

        /*
            Jika suara sedang aktif,
            matikan.
        */

        if(soundEnabled){

            soundEnabled = false;

            soundButton.textContent =
            "🔇";

        }

        /*
            Jika suara mati,
            nyalakan.
        */

        else{

            soundEnabled = true;

            initAudio();

            soundButton.textContent =
            "🔊";

            playButtonSound();

        }

    }
);

</script>
